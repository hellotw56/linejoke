<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>年齡確認</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: url("https://iw233.cn/api.php?sort=mp") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      color: white;
    }

    button {
      margin: 10px;
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .yes {
      background-color: #28a745;
      color: white;
    }
    .yes:hover { background-color: #218838; }

    .no {
      background-color: #dc3545;
      color: white;
    }
    .no:hover { background-color: #c82333; }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="overlay" id="age-check">
    <h2>請確認您的年齡</h2>
    <button class="no" onclick="alert('未滿18歲禁止觀看！')">未滿 18 歲</button>
    <button class="yes" onclick="rickroll()">滿 18 歲</button>
  </div>

  <script>
    function rickroll() {
      document.body.innerHTML = `
        <video id="video" autoplay controls>
          <source src="rickroll.mp4" type="video/mp4">
          您的瀏覽器不支援 HTML5 video.
        </video>`;

      let video = document.getElementById("video");
      // 嘗試全螢幕
      let req = video.requestFullscreen 
             || video.webkitRequestFullscreen 
             || video.msRequestFullscreen;
      if (req) req.call(video);
    }
  </script>
</body>
</html>
